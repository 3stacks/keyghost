# Tag-driven release: push a tag `vX.Y.Z` and this workflow builds, signs,
# notarizes, publishes a GitHub Release with the DMG attached, generates a
# Sparkle appcast.xml, and pushes both DMG + appcast to the keyghost R2 bucket
# so existing installs can auto-update from https://keyghost.lukeboyle.com/.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_DEVELOPER_ID_CERT_BASE64    base64 of the .p12 export of the
#                                     "Developer ID Application" cert + key
#   MACOS_DEVELOPER_ID_CERT_PASSWORD  password used when exporting the .p12
#   KEYCHAIN_PASSWORD                 any string — password for the ephemeral
#                                     CI keychain (not reused elsewhere)
#   SIGNING_IDENTITY                  e.g. "Developer ID Application: Luke Boyle (TEAMID)"
#   APPLE_ID                          Apple ID email used for notarization
#   APPLE_ID_PASSWORD                 app-specific password from appleid.apple.com
#   APPLE_TEAM_ID                     Apple Developer Team ID (10-char)
#   SPARKLE_ED_PRIVATE_KEY            EdDSA private key generated by Sparkle's
#                                     ./bin/generate_keys tool. The matching
#                                     public key lives in Bundle/Info.plist as
#                                     SUPublicEDKey.
#   CLOUDFLARE_API_TOKEN              R2 API token with object read+write on
#                                     the 'keyghost' bucket
#   CLOUDFLARE_ACCOUNT_ID             Cloudflare account ID hosting the bucket
#                                     (currently 66bbbf59d9ee8948f770553dfc0d5721)

name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0). Used only for manual runs.'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install wrangler
        run: bun install

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign + notarytool to use the key without a UI prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Prepend the new keychain to the search list so codesign finds it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_PATH"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          xcrun notarytool store-credentials notarytool-profile \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Build, sign, notarize DMG + appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PROFILE: notarytool-profile
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./scripts/build-dmg.sh

      - name: Verify notarized DMG
        run: |
          DMG="build/KeyGhost-${{ steps.version.outputs.version }}.dmg"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyGhost-${{ steps.version.outputs.version }}-dmg
          path: |
            build/KeyGhost-*.dmg
            build/appcast.xml
          retention-days: 30

      - name: Publish to R2
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/upload-r2.sh

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "build/KeyGhost-$VERSION.dmg" \
            "build/appcast.xml" \
            --title "KeyGhost v$VERSION" \
            --generate-notes
